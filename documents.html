body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e6f0ff; /* Light Blue */
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    padding-top: 50px;
}
.container {
    background: #001f3f; /* Navy Blue */
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    width: 450px;
    max-width: 90%;
    color: #fff;
    text-align: center;
}
h2 {
    margin-bottom: 20px;
    color: #b3d1ff; /* Light Blue */
}
ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
li {
    margin: 10px 0;
}
a, .card {
    display: block;
    text-decoration: none;
    color: #001f3f;
    background: #b3d1ff;
    padding: 12px 15px;
    border-radius: 10px;
    transition: 0.3s;
    font-weight: bold;
    cursor: pointer;
}
a:hover, .card:hover {
    background: #001f3f;
    color: #b3d1ff;
}
.hidden { display: none; }
.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 15px;
    border-radius: 8px;
    background: #b3d1ff;
    color: #001f3f;
    cursor: pointer;
    font-weight: bold;
    transition:0.3s;
    text-align: left;
}
.back-btn:hover {
    background: #001f3f;
    color: #b3d1ff;
}
.card-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}
/* Modal styles */
.modal {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
    flex-direction:column;
}
.modal iframe, .modal video {
    width: 100%;
    border: none;
    border-radius: 5px;
}
.modal iframe.doc-frame {
    height: 100%;
}
.modal video {
    height: 60%; /* Videos smaller initially */
}
.modal-controls {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    gap: 10px;
    z-index: 1001;
}
.modal-controls button {
    padding: 8px 15px;
    border-radius:8px;
    border:none;
    font-weight:bold;
    cursor:pointer;
    background:#b3d1ff;
    color:#001f3f;
    transition:0.3s;
}
.modal-controls button:hover {
    background:#001f3f;
    color:#b3d1ff;
}
</style>

// Selected
let selectedTerm = "";
let selectedCourse = "";

// Pages
const pageTerm = document.getElementById("pageTerm");
const pageCourse = document.getElementById("pageCourse");
const pageFiles = document.getElementById("pageFiles");

const termList = document.getElementById("termList");
const courseList = document.getElementById("courseList");
const filesList = document.getElementById("filesList");

// Modal
const modal = document.getElementById("modal");
const modalFrame = document.getElementById("modalFrame");
const modalVideo = document.getElementById("modalVideo");
const downloadBtn = document.getElementById("downloadBtn");

// Populate Term
Object.keys(docsc).forEach(term => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="#">${term}</a>`;
    li.onclick = () => { selectedTerm = term; showCourses(); };
    termList.appendChild(li);
});

function showCourses(){
    pageTerm.classList.add("hidden");
    pageCourse.classList.remove("hidden");
    courseList.innerHTML = "";
    Object.keys(docsc[selectedTerm]).forEach(course => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#">${course}</a>`;
        li.onclick = () => { selectedCourse = course; showFiles(); };
        courseList.appendChild(li);
    });
}

function showFiles(){
    pageCourse.classList.add("hidden");
    pageFiles.classList.remove("hidden");
    filesList.innerHTML = "";
    const topicFiles = docsc[selectedTerm][selectedCourse];
    if(!topicFiles || topicFiles.length === 0){
        filesList.innerHTML = "<div class='card'>No files available.</div>";
        return;
    }
    topicFiles.forEach(f => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<p>${f.name} ${f.type==="doc"?"📄":"▶️"}</p>`;
        div.onclick = () => openModal(f);
        filesList.appendChild(div);
    });
}

// Open Modal
function openModal(f){
    modal.style.display = "flex";
    if(f.type==="doc"){
        modalFrame.src = f.link;
        modalFrame.classList.remove("hidden");
        modalVideo.classList.add("hidden");
        downloadBtn.style.display = "inline-block";
        downloadBtn.onclick = () => {
            const downloadLink = f.link.replace('/preview','/uc?export=download');
            window.open(downloadLink,'_blank');
        };
    } else {
        modalVideo.src = f.link;
        modalVideo.classList.remove("hidden");
        modalFrame.classList.add("hidden");
        downloadBtn.style.display = "none";
    }
}

// Close Modal
function closeModal(){
    modal.style.display = "none";
    modalFrame.src = "";
    modalVideo.src = "";
}

// Back button
function goBack(page){
    pageTerm.classList.add("hidden");
    pageCourse.classList.add("hidden");
    pageFiles.classList.add("hidden");
    if(page === 'term') pageTerm.classList.remove("hidden");
    if(page === 'course') pageCourse.classList.remove("hidden");
}
