<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz | Learn with Smarthub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8}
.header{background:#0B3D91;color:white;padding:15px 20px 25px;border-bottom-left-radius:22px;border-bottom-right-radius:22px;text-align:center}
.content{padding:20px}
.card{background:white;padding:25px;border-radius:14px;text-align:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:15px;position:relative}
.card i{font-size:30px;margin-bottom:10px}
.quiz-container{background:white;padding:20px;border-radius:12px;max-width:800px;margin:auto}
.options button{width:100%;padding:12px;margin-bottom:10px;border:none;border-radius:8px;background:#eef3fa;cursor:pointer}
.options button.correct{background:#4caf50;color:white}
.options button.wrong{background:#f44336;color:white}
.next-btn{padding:10px 18px;background:#0B3D91;color:white;border:none;border-radius:8px;cursor:pointer}
.timer{text-align:right;font-weight:bold;color:#0B3D91}
.progress{margin-bottom:10px;font-weight:bold;color:#0B3D91}
.score-tag{position:absolute;top:10px;right:20px;font-weight:bold;color:#0B3D91}
.redo-btn{padding:5px 10px;background:#0B3D91;color:white;border:none;border-radius:6px;cursor:pointer;margin-top:10px;display:inline-block}
.pending-tag{padding:5px 10px;border-radius:6px;margin-top:10px;display:inline-block;color:white}
.pending-tag.pending{background:orange;}
.pending-tag.approved{background:green;}
</style>
</head>

<body>

<div class="header">
  <h3>Learn with Smarthub</h3>
  <p>Welcome, <span id="username">Student</span></p>
</div>

<div class="content">
  <div id="courseView"></div>
  <div id="quizView" style="display:none"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB7e9k4jB4sVDpqK0wKdY1GK3wEI8fFck4",
  authDomain: "smarthub-ff357.firebaseapp.com",
  projectId: "smarthub-ff357"
});

const db = firebase.firestore();
const auth = firebase.auth();

let currentUserId="", currentUserName="Student";
let index=0, score=0, timer=1200, interval;

/* QUIZ DATA */
const quiz={
 title:"Tutorial Sheet 1 - Physics",
 course:"PH110",
 questions:[
  {q:"1. A body is moving with constant velocity v = (20 ± 0.4) m/s. Calculate its displacement with error limit after time t = (10 ± 0.2) s.",options:["200 ± 2 m","200 ± 6 m","200 ± 4 m","200 ± 0.6 m"],answer:2},
  {q:"2. Number of significant figures in 0.00456?",options:["2","3","4","5"],answer:1},
  {q:"3. Number of significant figures in 123.450?",options:["5","6","4","3"],answer:1},
  {q:"4. Number of significant figures in 50.0?",options:["1","2","3","4"],answer:2},
  {q:"5. Number of significant figures in 1500?",options:["2","3","4","1"],answer:0},
  {q:"6. Number of significant figures in 100?",options:["1","2","3","0"],answer:0},
  {q:"7. Average length and mean error?",options:["2.482 ± 0.016 m","2.482 ± 0.012 m","2.48 ± 0.02 m","2.48 ± 0.01 m"],answer:0},
  {q:"8. Dimensions of velocity?",options:["LT⁻¹","MLT⁻¹","LT⁻²","M⁰L¹T⁰"],answer:0},
  {q:"9. Dimensions of force?",options:["MLT⁻¹","MLT⁻²","M²LT⁻²","ML²T⁻²"],answer:1},
  {q:"10. Does T = 2π√(l/g) obey homogeneity?",options:["Yes","No","Only if l=1","Cannot determine"],answer:0},
  {q:"11. de Broglie wavelength λ ∝ ?",options:["h/mv","mv/h","hmv","m/hv"],answer:0},
  {q:"12. Period of simple pendulum?",options:["√(l/g)","√(g/l)","l²/g","g/l²"],answer:0},
  {q:"13. Centripetal force formula?",options:["mv²/r","mr²/v","mv/r²","m²v/r"],answer:0},
  {q:"14. Dimensions of electric charge?",options:["IT","I/T","I²T","I√T"],answer:0},
  {q:"15. Viscosity η depends on m, d, v. η ∝ ?",options:["√(mv)/d","md/v","mv/d²","m²v/d"],answer:0},
  {q:"16. Is W = F×v correct dimensionally?",options:["Incorrect","Correct","Only if v=1","Cannot determine"],answer:0},
  {q:"17. Units of a, b, c in v = at² + bt + c?",options:["L/T³, L/T², L/T","L/T², L/T, L","L/T, L/T², L²","L/T³, L/T, L"],answer:1},
  {q:"18. Dimensions of a and b in gas equation?",options:["a: ML⁻¹T⁻², b: L³","a: ML²T⁻², b: L²","a: MLT⁻¹, b: L³","a: ML⁻²T⁻², b: L³"],answer:0},
  {q:"19. Express using prefixes",options:["0.85 mL, 54.4 pg, 73 Mm, 9.45 s","0.85 mL, 5.44 ng, 73 Mm, 9.45 s","0.85 L, 54.4 pg, 73 km, 9.45 s","0.85 L, 54.4 ng, 73 Mm, 9.45 s"],answer:0}
 ]
};

/* AUTH */
auth.onAuthStateChanged(user=>{
 if(!user){location.href="login.html";return;}
 currentUserId=user.uid;
 currentUserName=user.displayName||"Student";
 document.getElementById("username").innerText=currentUserName;
 loadCourseCard();
});

/* REAL-TIME COURSE CARD */
function loadCourseCard(){
  const ref = db.collection("results").doc(currentUserId+"_"+quiz.title);

  // Listen in real-time
  ref.onSnapshot(doc => {
    let scoreText="", redoUI="";

    // Initialize fields
    let submitted=false, redoRequested=false, redoApproved=false, finalScore=0;
    if(doc.exists){
      const d = doc.data();
      submitted = d.submitted || false;
      redoRequested = d.redoRequested || false;
      redoApproved = d.redoApproved || false;
      finalScore = d.finalScore || 0;
    }

    // Determine UI
    if(submitted){
      scoreText = `<div class="score-tag">Score: ${finalScore}/${quiz.questions.length}</div>`;
      if(redoApproved){
        redoUI = `<div class="pending-tag approved">Approved</div>`;
      } else if(redoRequested){
        redoUI = `<div class="pending-tag pending">Pending</div>`;
      } else {
        redoUI = `<button class="redo-btn" onclick="requestRedo()">Redo</button>`;
      }
    }

    document.getElementById("courseView").innerHTML =
      `<div class="card" onclick="startQuiz()">
         <i class="fa fa-atom"></i><br><br>
         <b>${quiz.course} – ${quiz.title}</b>
         ${scoreText}${redoUI}
       </div>`;
  });
}

/* START QUIZ */
function startQuiz(){
 const ref = db.collection("results").doc(currentUserId+"_"+quiz.title);
 ref.get().then(doc=>{
   if(!doc.exists){beginQuiz(); return;}
   const d = doc.data();
   if(d.submitted && !d.redoApproved){return;} // locked
   if(d.redoApproved){
     ref.update({redoApproved:false, redoRequested:false, submitted:false}).then(()=> beginQuiz());
   }
 });
}

/* BEGIN QUIZ */
function beginQuiz(){
 index=0; score=0; timer=1200;
 document.getElementById("courseView").style.display="none";
 document.getElementById("quizView").style.display="block";
 showQuestion(); startTimer();
}

/* SHOW QUESTION */
function showQuestion(){
 const q=quiz.questions[index];
 let html=`<div class="quiz-container">
 <div class="timer" id="timer"></div>
 <div class="progress">Question ${index+1}/${quiz.questions.length}</div>
 <h3>${q.q}</h3><div class="options">`;
 q.options.forEach((o,i)=> html+=`<button onclick="selectOpt(${i})">${o}</button>`);
 html+=`</div><button class="next-btn" onclick="nextQ()">Next</button></div>`;
 document.getElementById("quizView").innerHTML=html;
}

/* SELECT OPTION */
function selectOpt(i){
 const q=quiz.questions[index];
 document.querySelectorAll(".options button").forEach((b,x)=>{
   b.disabled=true;
   if(x===q.answer)b.classList.add("correct");
   if(x===i && i!==q.answer)b.classList.add("wrong");
 });
 if(i===q.answer)score++;
}

/* NEXT QUESTION */
function nextQ(){
 index++;
 if(index<quiz.questions.length) showQuestion();
 else finishQuiz();
}

/* TIMER */
function startTimer(){
 interval=setInterval(()=>{
   timer--;
   document.getElementById("timer").innerText=
     "Time left: "+Math.floor(timer/60)+":"+String(timer%60).padStart(2,"0");
   if(timer<=0){clearInterval(interval); finishQuiz();}
 },1000);
}

/* FINISH QUIZ */
function finishQuiz(){
 clearInterval(interval);
 db.collection("results").doc(currentUserId+"_"+quiz.title).set({
   userId: currentUserId,
   studentName: currentUserName,
   quizTitle: quiz.title,
   course: quiz.course,
   finalScore: score,
   total: quiz.questions.length,
   submitted: true,
   redoRequested: false,
   redoApproved: false,
   completedAt: firebase.firestore.FieldValue.serverTimestamp()
 }, {merge:true}).then(()=>{
   document.getElementById("quizView").style.display="none";
   document.getElementById("courseView").style.display="block";
 });
}

/* REQUEST REDO */
function requestRedo(){
 db.collection("results").doc(currentUserId+"_"+quiz.title).update({
   redoRequested: true
 });
}
</script>

</body>
</html>
